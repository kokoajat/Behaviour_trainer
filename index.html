<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Behaviour Trainer - Rutiinin katkaisu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
            text-align: center;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        h2 { color: #333; }
        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-start { background-color: #e63946; }
        .btn-start:hover { background-color: #d62828; }
        .btn-success { background-color: #2a9d8f; display: none; margin-top: 10px;}
        .btn-fail { background-color: #f4a261; display: none; margin-top: 10px;}
        #ajastin {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
            color: #1d3557;
        }
        #viesti {
            font-size: 16px;
            color: #555;
            min-height: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Himon viivästys</h2>
        <p>Asteittainen vähennys alkaa rutiinin rikkomisesta.</p>
        
        <button id="aloitaBtn" class="btn btn-start" onclick="aloitaAjastin()">Koen himoa - Katkaise rutiini</button>
        
        <div id="ajastin">10:00</div>
        <div id="viesti">Tunnista ärsyke. Ota hetki aikaa ennen toimintaa.</div>

        <button id="onnistuiBtn" class="btn btn-success" onclick="tallennaTulos(true)">Vastustin himoa!</button>
        <button id="repesiBtn" class="btn btn-fail" onclick="tallennaTulos(false)">Annoin periksi (Vähennys jatkuu)</button>
    </div>

    <script>
        let ajastin;
        let aikaaJaljella = 600; // 10 minuuttia sekunteina

        function paivitaNaytto() {
            let minuutit = Math.floor(aikaaJaljella / 60);
            let sekunnit = aikaaJaljella % 60;
            document.getElementById("ajastin").innerText = 
                `${minuutit}:${sekunnit < 10 ? '0' : ''}${sekunnit}`;
        }

        function aloitaAjastin() {
            document.getElementById("aloitaBtn").style.display = "none";
            document.getElementById("viesti").innerText = "Odota. Anna himon aallon mennä ohi. Keskity hengitykseen tai juo lasi vettä.";
            
            ajastin = setInterval(function() {
                aikaaJaljella--;
                paivitaNaytto();

                if (aikaaJaljella <= 0) {
                    clearInterval(ajastin);
                    document.getElementById("viesti").innerText = "10 minuuttia kului! Himo on todennäköisesti heikentynyt. Miten kävi?";
                    document.getElementById("onnistuiBtn").style.display = "block";
                    document.getElementById("repesiBtn").style.display = "block";
                }
            }, 1000);
        }

        function tallennaTulos(onnistui) {
            document.getElementById("onnistuiBtn").style.display = "none";
            document.getElementById("repesiBtn").style.display = "none";
            
            if (onnistui) {
                document.getElementById("viesti").innerHTML = "<strong>Loistavaa!</strong> Palkitse itsesi jollain muulla tavalla.";
            } else {
                document.getElementById("viesti").innerHTML = "Ei hätää, vähentäminen on prosessi. <strong>Seuraavalla kerralla olet vahvempi.</strong>";
            }
            
            // Palautetaan ohjelma alkutilaan pienen viiveen jälkeen
            setTimeout(() => {
                aikaaJaljella = 600;
                paivitaNaytto();
                document.getElementById("aloitaBtn").style.display = "block";
                document.getElementById("viesti").innerText = "Tunnista ärsyke. Ota hetki aikaa ennen toimintaa.";
            }, 4000);
        }
    </script>
</body>
</html>
        button:hover {
            background-color: #0056b3;
        }
        #tulos {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Behaviour Trainer</h2>
        <p>Mitä haluat tehdä?</p>
        <select id="tapaValinta">
            <option value="oppiminen">Opi uusi tapa (Spaced Repetition)</option>
            <option value="poisoppiminen">Opi pois huonosta tavasta (Habit Loop)</option>
        </select>
        <button onclick="aloitaOhjelma()">Aloita ohjelma</button>
        <p id="tulos"></p>
    </div>

    <script>
        function aloitaOhjelma() {
            const valinta = document.getElementById("tapaValinta").value;
            const tulosKentta = document.getElementById("tulos");

            if (valinta === "oppiminen") {
                tulosKentta.innerHTML = "<strong>Strategia: Ositettu kertaus.</strong><br><br>Ensimmäinen muistutus asetettu 1 tunnin päähän. Seuraava 24 tunnin päähän.";
            } else {
                tulosKentta.innerHTML = "<strong>Strategia: Rutiinin katkaisu.</strong><br><br>Ensimmäinen muistutus asetettu 3 tunnin päähän satunnaistettuna, jotta aivot pysyvät varuillaan.";
            }
        }
    </script>
</body>
</html>
